<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>PageTrawl</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="options">
  <main class="opt-page">
    <h1 data-i18n="opt.heading">Ayarlar</h1>

    <section class="opt-card">
      <label class="opt-row">
        <span data-i18n="settings.folder">Kayıt klasörü</span>
        <span class="folder-row">
          <input type="text" id="folder" data-i18n-ph="folder.ph" placeholder="Yol okunuyor…" spellcheck="false">
          <button class="ghost" id="browse" data-i18n="settings.browse">Gözat…</button>
          <button class="link" id="folderReset" data-i18n="settings.reset">Sıfırla</button>
        </span>
      </label>
      <p id="folderNote" class="muted small"></p>
    </section>

    <section class="opt-card">
      <label class="opt-row narrow">
        <span data-i18n="settings.concurrent">Aynı anda indirme</span>
        <input type="number" id="maxConcurrent" min="1" max="10" value="4">
      </label>

      <label class="opt-row">
        <span data-i18n="settings.template">Dosya adı şablonu</span>
        <input type="text" id="template" spellcheck="false" placeholder="{host}/{name}.{ext}">
      </label>
      <p class="muted small" id="templateHint" data-i18n="settings.templateHint"></p>

      <label class="check">
        <input type="checkbox" id="saveAs">
        <span data-i18n="settings.saveAs">Her dosyada nereye kaydedileceğini sor</span>
      </label>
    </section>

    <div class="opt-actions">
      <button class="primary" id="save" data-i18n="settings.save">Kaydet</button>
      <span id="saved" class="muted small"></span>
    </div>
  </main>

  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
